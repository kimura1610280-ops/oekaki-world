<style>
:root{
  /* 光のテーマ */
  --desk:#E9DFCB;
  --desk-2:#DFD3BA;
  --chrome:#FFFFFF;
  --chrome-2:#F6EFE0;
  --ink:#2A2A33;
  --ink-2:#6F6A60;
  --line:rgba(42,42,51,.16);
  --accent:#FF6B3D;
  --accent-2:#2E86D6;
  --yellow:#FFC53D;
  --danger:#D8503C;
  --danger-bg:#FFE7E3;
  --btn-drop:rgba(42,42,51,.22);
  /* 紙の上はどちらのテーマでも紙の色（クレヨンが見えるため） */
  --paper:#FFFDF6;
  --on-paper:#2A2A33;
  --on-paper-2:#A79E8B;
  --radius:18px;
  --tap:54px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#211F28;
    --desk-2:#17161C;
    --chrome:#312F3B;
    --chrome-2:#3A3746;
    --ink:#F3EFE5;
    --ink-2:#A9A296;
    --line:rgba(243,239,229,.2);
    --danger-bg:#4C2C28;
    --btn-drop:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --desk:#211F28;
  --desk-2:#17161C;
  --chrome:#312F3B;
  --chrome-2:#3A3746;
  --ink:#F3EFE5;
  --ink-2:#A9A296;
  --line:rgba(243,239,229,.2);
  --danger-bg:#4C2C28;
  --btn-drop:rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--desk);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#app{height:100%;position:relative;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
[hidden]{display:none !important;}

/* ---------- 共通パーツ ---------- */
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
button:focus-visible{outline:3px solid var(--accent-2);outline-offset:3px;}
.big{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  font-weight:800;font-size:clamp(17px,2.4vw,21px);
  color:#fff;background:var(--accent);
  padding:0 clamp(18px,3vw,30px);min-height:var(--tap);
  border-radius:var(--radius);
  box-shadow:0 5px 0 var(--btn-drop);
  transition:transform .08s,box-shadow .08s;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-drop);}
.chip{
  background:var(--chrome);border-radius:14px;min-height:44px;padding:0 14px;
  font-weight:700;font-size:15px;color:var(--ink);
  box-shadow:0 3px 0 var(--btn-drop);
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:transform .08s,box-shadow .08s;
}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-drop);}
.chip.icon{padding:0;width:44px;justify-content:center;font-size:19px;}

/* ---------- ステージ ---------- */
#stageCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.hud{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;pointer-events:none;flex-wrap:wrap;}
.hud > *{pointer-events:auto;}
.hud-top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));flex-wrap:nowrap;}
.hud-bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:center;}
.brand{
  font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:19px;
  color:#fff;text-shadow:0 2px 6px rgba(20,30,50,.45);letter-spacing:.02em;
  pointer-events:none;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hud-top .spacer{flex:1;pointer-events:none;}
.count{
  font-weight:700;font-size:14px;color:#fff;background:rgba(20,28,45,.42);
  padding:7px 12px;border-radius:12px;backdrop-filter:blur(3px);pointer-events:none;
}
.tip{
  position:absolute;left:50%;transform:translateX(-50%);
  top:calc(66px + env(safe-area-inset-top,0px));
  max-width:min(600px,calc(100% - 32px));
  background:var(--chrome);color:var(--ink);
  border-radius:16px;padding:11px 18px;font-size:15px;font-weight:500;line-height:1.5;
  box-shadow:0 6px 18px rgba(20,25,40,.25);text-align:center;
  opacity:0;transition:opacity .35s,transform .35s;pointer-events:none;
}
.tip.on{opacity:1;transform:translateX(-50%) translateY(4px);}
.tip b{color:var(--accent);}

/* ---------- おえかき ---------- */
.paperWrap{flex:1;min-height:0;position:relative;margin:12px 12px 0;}
#drawCv{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  background:var(--paper);border-radius:20px;touch-action:none;
  box-shadow:0 4px 0 rgba(42,42,51,.14),0 14px 30px rgba(40,35,25,.16);
}
.hint{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--on-paper-2);font-size:clamp(16px,2.6vw,22px);font-weight:700;
  pointer-events:none;text-align:center;padding:0 24px;
}
.tools{
  display:flex;flex-direction:column;gap:10px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.palette{justify-content:center;gap:9px;}
.crayon{
  width:46px;height:46px;border-radius:50%;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 2px 0 var(--btn-drop);
  transition:transform .1s;position:relative;
}
.crayon[aria-pressed="true"]{transform:translateY(-6px) scale(1.12);}
.crayon[aria-pressed="true"]::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:3px solid var(--ink);
}
.crayon.white{box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),0 0 0 2px var(--line),0 2px 0 var(--btn-drop);}
.brushBox{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:78px;height:var(--tap);background:var(--chrome);border-radius:14px;gap:2px;
  box-shadow:0 3px 0 var(--btn-drop);
}
.brushDot{border-radius:50%;background:var(--ink);}
.brushName{font-size:11px;font-weight:700;color:var(--ink-2);}
.sizes{display:flex;gap:6px;}
.sz{
  width:46px;height:var(--tap);background:var(--chrome);border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 var(--btn-drop);transition:transform .08s;
}
.sz[aria-pressed="true"]{background:var(--yellow);}
.sz:active{transform:translateY(2px);}
.sz i{display:block;border-radius:50%;background:var(--ink);}
.tool{
  min-height:var(--tap);padding:0 15px;background:var(--chrome);border-radius:14px;
  font-weight:700;font-size:15px;box-shadow:0 3px 0 var(--btn-drop);
  display:inline-flex;align-items:center;gap:6px;transition:transform .08s,box-shadow .08s;
}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 var(--btn-drop);}
.tool[aria-pressed="true"]{background:var(--yellow);}
.tool.warn{color:var(--danger);}
.spacer{flex:1;}
.go{background:var(--accent);}

/* ---------- ズーム（キャンバスに重ねるので場所を取らない） ---------- */
.zoomBar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;z-index:3;}
.worldZoom{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6;
}
/* ぜんがめん：ワールドだけを残して、まわりの道具を消す */
#stage.immersive .hud-bottom,
#stage.immersive .brand,
#stage.immersive #worldBtn,
#stage.immersive #soundBtn,
#stage.immersive .worldZoom{display:none;}
#stage.immersive #fullBtn{opacity:.5;}
#stage.immersive #fullBtn:active{opacity:1;}
.zLabel{
  font-size:11px;font-weight:700;color:#fff;background:rgba(20,28,45,.55);
  padding:3px 7px;border-radius:8px;font-variant-numeric:tabular-nums;
}
.zbtn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.93);color:#2A2A33;
  font-weight:800;font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 7px rgba(40,35,25,.32);transition:transform .08s;
}
.zbtn:active{transform:scale(.92);}
.zoomLabel{
  position:absolute;left:12px;top:10px;z-index:3;pointer-events:none;
  background:rgba(43,43,51,.78);color:#fff;
  font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;
  font-variant-numeric:tabular-nums;
}
/* ---------- こさ（透明度） ---------- */
.opa{
  display:flex;align-items:center;gap:8px;flex:1;min-width:118px;
  background:var(--chrome);border-radius:14px;height:var(--tap);padding:0 13px;
  box-shadow:0 3px 0 var(--btn-drop);
}
.opaName{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;}
.opa input[type="range"]{flex:1;min-width:56px;height:30px;accent-color:var(--accent);cursor:pointer;}

/* ---------- おやすみボックス ---------- */
.sheet{
  position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:rgba(18,24,38,.52);padding:16px;
}
.sheetCard{
  background:var(--chrome);border-radius:26px;padding:18px;
  width:min(560px,100%);max-height:100%;
  display:flex;flex-direction:column;gap:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.38);
}
.sheetTitle{
  font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:19px;
  text-align:center;color:var(--ink);
}
.sheetSub{font-size:13px;color:var(--ink-2);text-align:center;margin-top:-8px;}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,104px);justify-content:center;
  gap:10px;overflow-y:auto;padding:2px;-webkit-overflow-scrolling:touch;
}
.zzz{
  position:relative;background:var(--chrome-2);border-radius:18px;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;padding:10px;
  box-shadow:0 3px 0 var(--btn-drop);transition:transform .08s,box-shadow .08s;
}
.zzz:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 var(--btn-drop);}
.zzz img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;}
.zzz::after{content:"💤";position:absolute;top:5px;right:7px;font-size:14px;}
.sheetBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.zzz.edit::after{content:"\270F\FE0F";}
.tileWrap{position:relative;}
.tileWrap .zzz{width:100%;}
.star{
  position:absolute;left:5px;top:5px;z-index:2;
  width:31px;height:31px;border-radius:50%;
  background:rgba(255,255,255,.92);color:#B9AE9A;
  font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(40,35,25,.28);transition:transform .1s;
}
.star.on{color:#F0A81E;background:#FFF4D6;}
.star:active{transform:scale(.88);}
.grid.deleting .zzz{background:var(--danger-bg);box-shadow:0 3px 0 rgba(216,80,60,.5);}
.grid.deleting .zzz::after{content:"\2715";color:var(--danger);font-weight:800;font-size:17px;top:3px;right:8px;}
.chip[aria-pressed="true"]{background:var(--danger);color:#fff;}

/* ---------- トースト ---------- */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--desk);
  padding:12px 20px;border-radius:14px;font-weight:700;font-size:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:20;pointer-events:none;
  opacity:0;transition:opacity .3s;max-width:calc(100% - 32px);text-align:center;
}
.toast.on{opacity:1;}

@media (max-width:520px){
  :root{--tap:44px;}

<body>

<div id="app">
  <!-- ========= ステージ ========= -->
  <section class="screen" id="stage">
    <canvas id="stageCv"></canvas>
    <div class="hud hud-top">
      <div class="brand">おえかきワールド</div>

  <!-- ========= おえかき ========= -->

<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };

/* ====================== おと ====================== */
var AC=null, muted=false;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended'){ AC.resume(); }
  return AC;
}
function tone(f1,f2,dur,type,vol){
  var c=ac(); if(!c||muted) return;
  var o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
  o.type=type||'sine';
  o.frequency.setValueAtTime(f1,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol||0.16, t+0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.03);
}
var sfx={
  jump:function(){ tone(430,880,0.17,'sine',0.15); },
  grab:function(){ tone(720,520,0.09,'triangle',0.11); },
  toss:function(){ tone(320,940,0.20,'triangle',0.13); },
  land:function(v){ tone(180,90,0.12,'sine',clamp(v/9000,0.03,0.12)); },
  tap:function(){ tone(900,1250,0.07,'sine',0.08); },
  born:function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f,f*1.02,0.24,'sine',0.13); }, i*95); }); },
  bye:function(){ tone(500,160,0.30,'sine',0.12); }
};

/* ====================== キャンバス ====================== */
var stageScreen=$('stage'), drawScreen=$('draw');
var scv=$('stageCv'), dcv=$('drawCv');
var sctx=scv.getContext('2d');
var dctx=dcv.getContext('2d',{willReadFrequently:true});
var SW=0, SH=0, DW=0, DH=0, DPR=1;

function fit(cv,ctx){
  var r=cv.getBoundingClientRect();
  var dpr=Math.min(window.devicePixelRatio||1, 2.5);
  var w=Math.max(1,Math.round(r.width*dpr)), h=Math.max(1,Math.round(r.height*dpr));
  if(cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width, h:r.height, dpr:dpr};
}
function layout(){
  if(!stageScreen.hidden){
    var a=fit(scv,sctx); SW=a.w; SH=a.h; SDPR=a.dpr;
    setWorld();
    for(var i=0;i<creatures.length;i++){
      var c=creatures[i];
      c.x=clamp(c.x, c.w/2, Math.max(c.w/2, WW-c.w/2));
      c.y=clamp(c.y, c.h/2, Math.max(c.h/2, WH-c.h/2));
    }
  }
  if(!drawScreen.hidden){
    var b=fit(dcv,dctx); DW=b.w; DH=b.h; DPR=b.dpr;
    ensureArt(); fitView(true); renderView();
    $('hint').style.display = strokes.length ? 'none' : 'flex';
  }
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function(){ setTimeout(layout,250); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

function pos(cv,e){ var r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }

/* ====================== おえかき ======================
   絵は「原画キャンバス(art)」に描き、画面はそれを覗く窓として表示する。
   こうするとズームしても画面外の絵が失われない。 */
var COLORS=[
  ['あか','#E8402A'],['オレンジ','#F58024'],['きいろ','#F5C518'],['きみどり','#8CC63E'],
  ['みどり','#2FA84F'],['みずいろ','#48C0E8'],['あお','#2A6FD6'],['むらさき','#8B57C7'],
  ['ピンク','#F07AB0'],['ちゃいろ','#8B5A2B'],['くろ','#2B2B33'],['しろ','#FFFFFF']
];
var SIZES=[['ほそい',7],['ふつう',16],['ふとい',32]];
var color=COLORS[0][1], colorName=COLORS[0][0], size=SIZES[1][1];
var alpha=1, erasing=false, filling=false;
var strokes=[], cur=null, penSeen=false;

var art=null, actx=null, AW=0, AH=0, ADPR=1;
var tmp=null, tctx=null, useTmp=false;
var pendingFav=false;      // なおし中の子の おきにいり状態
var editingSp=null;        // なおし中の子そのもの（やめたら戻す）
var baseLen=0;             // 読み込み直後の履歴の長さ（変更の有無を見る）
var zoom=1, baseScale=1, panX=0, panY=0;
function SC(){ return baseScale*zoom; }

function ensureArt(){
  if(art) return;
  ADPR=DPR; AW=DW; AH=DH;
  art=document.createElement('canvas');
  art.width=Math.max(1,Math.round(AW*ADPR));
  art.height=Math.max(1,Math.round(AH*ADPR));
  actx=art.getContext('2d',{willReadFrequently:true});
  actx.setTransform(ADPR,0,0,ADPR,0,0);
  tmp=document.createElement('canvas');
  tmp.width=art.width; tmp.height=art.height;
  tctx=tmp.getContext('2d');
  tctx.setTransform(ADPR,0,0,ADPR,0,0);
}
function clearTmp(){
  if(!tctx) return;
  tctx.save(); tctx.setTransform(1,0,0,1,0,0);
  tctx.clearRect(0,0,tmp.width,tmp.height); tctx.restore();
}
function clampPan(){
  var w=AW*SC(), h=AH*SC();
  panX = (w<=DW) ? (DW-w)/2 : clamp(panX, DW-w, 0);
  panY = (h<=DH) ? (DH-h)/2 : clamp(panY, DH-h, 0);
}
function fitView(keepZoom){
  baseScale=Math.min(DW/AW, DH/AH);
  if(!keepZoom) zoom=1;
  clampPan();
}
function renderView(){
  if(!art) return;
  dctx.setTransform(DPR,0,0,DPR,0,0);
  dctx.clearRect(0,0,DW,DH);
  dctx.imageSmoothingEnabled=true;
  dctx.drawImage(art, panX, panY, AW*SC(), AH*SC());
  if(useTmp){
    dctx.globalAlpha=alpha;
    dctx.drawImage(tmp, panX, panY, AW*SC(), AH*SC());
    dctx.globalAlpha=1;
  }
  $('zoomLabel').hidden = (zoom<=1.01);
  $('zoomLabel').textContent = Math.round(zoom*100)+'%';
}
/* 画面の座標 → 原画の座標 */
function toArt(sx,sy){ var k=SC(); return { x:(sx-panX)/k, y:(sy-panY)/k }; }

/* ---------- 道具 ---------- */
var palette=$('palette');
COLORS.forEach(function(c,i){
  var b=document.createElement('button');
  b.className='crayon'+(c[1]==='#FFFFFF'?' white':'');
  b.style.background=c[1];
  b.setAttribute('aria-label',c[0]);
  b.setAttribute('aria-pressed', i===0?'true':'false');
  b.addEventListener('click',function(){
    color=c[1]; colorName=c[0]; erasing=false;
    Array.prototype.forEach.call(palette.children,function(el){ el.setAttribute('aria-pressed','false'); });
    b.setAttribute('aria-pressed','true');
    $('eraserBtn').setAttribute('aria-pressed','false');
    updateBrush(); sfx.tap();
  });
  palette.appendChild(b);
});
var sizesEl=$('sizes');
SIZES.forEach(function(sz,i){
  var b=document.createElement('button');
  b.className='sz'; b.setAttribute('aria-label',sz[0]);
  b.setAttribute('aria-pressed', i===1?'true':'false');
  var d=Math.max(7,Math.min(26,sz[1]));
  b.innerHTML='<i style="width:'+d+'px;height:'+d+'px"></i>';
  b.addEventListener('click',function(){
    size=sz[1];
    Array.prototype.forEach.call(sizesEl.children,function(el){ el.setAttribute('aria-pressed','false'); });
    b.setAttribute('aria-pressed','true');
    updateBrush(); sfx.tap();
  });
  sizesEl.appendChild(b);
});
$('alphaRange').addEventListener('input',function(){
  alpha=Math.max(0.05, this.value/100);
  updateBrush();
});
function updateBrush(){
  var d=clamp(size,8,30), dot=$('brushDot');
  dot.style.width=d+'px'; dot.style.height=d+'px';
  dot.style.background= erasing ? 'var(--line)' : color;
  dot.style.opacity = erasing ? 1 : alpha;
  dot.style.boxShadow = (color==='#FFFFFF'&&!erasing) ? '0 0 0 2px var(--line)' : 'none';
  $('brushName').textContent = erasing ? 'けしゴム' : (filling ? 'ぬる' : colorName);
}

/* ---------- 原画への描画 ---------- */
function applyStyle(s,ctx,a){
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.lineWidth=s.size;
  ctx.strokeStyle=s.color; ctx.fillStyle=s.color;
  ctx.globalAlpha=a;
  ctx.globalCompositeOperation = s.erase ? 'destination-out' : 'source-over';
}
function resetStyle(ctx){ ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }
function dot(s,p,ctx,a){
  applyStyle(s,ctx,a);
  ctx.beginPath(); ctx.arc(p.x,p.y,s.size/2,0,Math.PI*2); ctx.fill();
  resetStyle(ctx);
}
/* 完成した線は1本のパスとして原画に描く（同じ線の重なりで濃くならない） */
function drawStroke(s){
  var a = s.erase ? 1 : (s.alpha===undefined?1:s.alpha);
  var p=s.pts;
  if(p.length===1){ dot(s,p[0],actx,a); return; }
  applyStyle(s,actx,a);
  actx.beginPath(); actx.moveTo(p[0].x,p[0].y);
  for(var i=1;i<p.length-1;i++){
    var m={x:(p[i].x+p[i+1].x)/2, y:(p[i].y+p[i+1].y)/2};
    actx.quadraticCurveTo(p[i].x,p[i].y,m.x,m.y);
  }
  actx.lineTo(p[p.length-1].x,p[p.length-1].y);
  actx.stroke(); resetStyle(actx);
}
/* 描いている途中は最後のひと区切りだけ足す。
   半透明のときは重ね書きで濃くなってしまうので、下書き用の板に不透明で描き、
   表示のときだけ薄くする。指を離したら本番の1本のパスとして原画に焼く。 */
function segment(s){
  var p=s.pts, n=p.length;
  if(n<2) return;
  var ctx = useTmp ? tctx : actx;
  applyStyle(s, ctx, useTmp ? 1 : (s.erase?1:(s.alpha===undefined?1:s.alpha)));
  ctx.beginPath();
  if(n===2){ ctx.moveTo(p[0].x,p[0].y); ctx.lineTo(p[1].x,p[1].y); }
  else{
    var a=p[n-3], b=p[n-2], c=p[n-1];
    ctx.moveTo((a.x+b.x)/2,(a.y+b.y)/2);
    ctx.quadraticCurveTo(b.x,b.y,(b.x+c.x)/2,(b.y+c.y)/2);
  }
  ctx.stroke(); resetStyle(ctx);
}
function commitTmp(){
  if(!useTmp) return;
  if(cur) drawStroke(cur);
  clearTmp(); useTmp=false;
}
function redrawArt(){
  if(!art) return;
  actx.save(); actx.setTransform(1,0,0,1,0,0);
  actx.clearRect(0,0,art.width,art.height); actx.restore();
  for(var i=0;i<strokes.length;i++){
    var s=strokes[i];
    if(s.type==='img'){
      actx.save(); actx.setTransform(1,0,0,1,0,0);
      actx.clearRect(0,0,art.width,art.height);
      actx.drawImage(s.img,0,0,art.width,art.height);
      actx.restore();
    }else{
      drawStroke(s);
    }
  }
  resetStyle();
}
function redrawAll(){
  redrawArt(); renderView();
  $('hint').style.display = strokes.length ? 'none' : 'flex';
}
/* ぬりつぶしや読み込んだ絵は線ではないので、その時点の原画を履歴に積む。
   古いスナップショットは新しいものに焼き込まれているので捨ててよい。 */
function pushSnapshot(){
  var snap=document.createElement('canvas');
  snap.width=art.width; snap.height=art.height;
  snap.getContext('2d').drawImage(art,0,0);
  strokes.push({type:'img', img:snap});
  var idx=[], i;
  for(i=0;i<strokes.length;i++) if(strokes[i].type==='img') idx.push(i);
  while(idx.length>3){
    strokes=strokes.slice(idx[1]);
    idx=[];
    for(i=0;i<strokes.length;i++) if(strokes[i].type==='img') idx.push(i);
  }
}

/* ---------- ぬりつぶし ---------- */
function hexRGB(h){
  return { r:parseInt(h.slice(1,3),16), g:parseInt(h.slice(3,5),16), b:parseInt(h.slice(5,7),16) };
}
function floodFill(ax,ay,hex,al){
  var W=art.width, H=art.height, id;
  try{ id=actx.getImageData(0,0,W,H); }catch(err){ return false; }
  var d=id.data;
  var x0=Math.round(ax*ADPR), y0=Math.round(ay*ADPR);
  if(x0<0||y0<0||x0>=W||y0>=H) return false;
  var si=(y0*W+x0)*4;
  var sr=d[si], sg=d[si+1], sb=d[si+2], sa=d[si+3];
  var fc=hexRGB(hex), fa=Math.round(al*255);
  if(Math.abs(sa-fa)<12 && sa>60 && Math.abs(sr-fc.r)+Math.abs(sg-fc.g)+Math.abs(sb-fc.b)<24) return false;
  var openStart = sa<30;
  function match(j){
    var a=d[j+3];
    if(openStart) return a<90;
    if(a<30) return false;
    return Math.abs(d[j]-sr)+Math.abs(d[j+1]-sg)+Math.abs(d[j+2]-sb)+Math.abs(a-sa) < 120;
  }
  var seen=new Uint8Array(W*H), stack=[x0,y0], filled=0;
  while(stack.length){
    var y=stack.pop(), x=stack.pop();
    if(seen[y*W+x]) continue;
    var xl=x;
    while(xl>=0 && !seen[y*W+xl] && match((y*W+xl)*4)) xl--;
    xl++;
    var xr=x;
    while(xr<W && !seen[y*W+xr] && match((y*W+xr)*4)) xr++;
    xr--;
    if(xr<xl) continue;
    for(var xx=xl;xx<=xr;xx++){
      var k=y*W+xx; seen[k]=1;
      var j=k*4;
      d[j]=fc.r; d[j+1]=fc.g; d[j+2]=fc.b; d[j+3]=fa;
      filled++;
    }
    for(var s2=-1;s2<=1;s2+=2){
      var ny=y+s2;
      if(ny<0||ny>=H) continue;
      for(var x2=xl;x2<=xr;x2++){
        var k2=ny*W+x2;
        if(!seen[k2] && match(k2*4)) stack.push(x2,ny);
      }
    }
  }
  if(!filled) return false;
  actx.save(); actx.setTransform(1,0,0,1,0,0);
  actx.putImageData(id,0,0); actx.restore();
  return true;
}

/* ---------- 直前の線を まんまる／まっすぐ に ---------- */
function tidyLast(){
  var s=strokes[strokes.length-1];
  if(!s || s.type==='img' || !s.pts || s.pts.length<3){
    toast('さいごに かいた 線を きれいにするよ'); return;
  }
  var p=s.pts, n=p.length, k, len=0;
  for(k=1;k<n;k++) len+=Math.hypot(p[k].x-p[k-1].x, p[k].y-p[k-1].y);
  if(len<24){ toast('もうすこし ながく かいてね'); return; }
  var gap=Math.hypot(p[n-1].x-p[0].x, p[n-1].y-p[0].y);
  if(gap < len*0.3){
    var cx=0, cy=0;
    for(k=0;k<n;k++){ cx+=p[k].x; cy+=p[k].y; }
    cx/=n; cy/=n;
    var r=0;
    for(k=0;k<n;k++) r+=Math.hypot(p[k].x-cx, p[k].y-cy);
    r/=n;
    var np=[];
    for(k=0;k<=72;k++){ var a=k/72*Math.PI*2; np.push({x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r}); }
    s.pts=np;
    toast('まんまるに なった！');
  }else{
    s.pts=[{x:p[0].x,y:p[0].y},{x:p[n-1].x,y:p[n-1].y}];
    toast('まっすぐに なった！');
  }
  redrawAll(); sfx.tap();
}

/* ---------- 指の操作（描く／2本指でズーム） ---------- */
var ptrs={}, ptrCount=0, drawId=null, gesture=null;
function ptrList(){ var a=[]; for(var k in ptrs) a.push(ptrs[k]); return a; }
function midOf(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }
function distOf(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

dcv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='pen') penSeen=true;
  if(penSeen && e.pointerType==='touch' && ptrCount===0) return;
  ac();
  var p=pos(dcv,e);
  ptrs[e.pointerId]={x:p.x,y:p.y};
  ptrCount++;
  try{ dcv.setPointerCapture(e.pointerId); }catch(err){}

  if(ptrCount>=2){
    // 2本目が乗ったら、描きかけの線は取り消してズーム操作に切り替える
    if(drawId!==null){
      if(cur && strokes[strokes.length-1]===cur) strokes.pop();
      cur=null; drawId=null; useTmp=false; clearTmp(); redrawAll();
    }
    var L=ptrList();
    gesture={ mid:midOf(L[0],L[1]), dist:Math.max(1,distOf(L[0],L[1])) };
    return;
  }
  if(gesture) return;

  if(filling){
    $('hint').style.display='none';
    var f=toArt(p.x,p.y);
    if(floodFill(f.x,f.y,color,alpha)){ pushSnapshot(); renderView(); sfx.tap(); }
    return;
  }
  $('hint').style.display='none';
  drawId=e.pointerId;
  var w=toArt(p.x,p.y);
  cur={color:color, size:size, erase:erasing, alpha:alpha, pts:[w]};
  strokes.push(cur);
  useTmp = (alpha<1 && !erasing);
  if(useTmp){ clearTmp(); dot(cur,w,tctx,1); }
  else{ dot(cur,w,actx,erasing?1:alpha); }
  renderView();
});
dcv.addEventListener('pointermove',function(e){
  if(!ptrs[e.pointerId]) return;
  var p=pos(dcv,e);
  ptrs[e.pointerId]={x:p.x,y:p.y};

  if(gesture && ptrCount>=2){
    var L=ptrList();
    var mid=midOf(L[0],L[1]), dist=Math.max(1,distOf(L[0],L[1]));
    var want=clamp(zoom*(dist/gesture.dist), 1, 5);
    var f=want/zoom;
    panX = mid.x - (gesture.mid.x - panX)*f;
    panY = mid.y - (gesture.mid.y - panY)*f;
    zoom = want;
    gesture.mid=mid; gesture.dist=dist;
    clampPan(); renderView();
    return;
  }
  if(e.pointerId!==drawId || !cur) return;
  var evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  var moved=false;
  for(var i=0;i<evts.length;i++){
    var q=pos(dcv,evts[i]);
    var w=toArt(q.x,q.y);
    var last=cur.pts[cur.pts.length-1];
    if(Math.abs(w.x-last.x)+Math.abs(w.y-last.y) < 1.0/SC()) continue;
    cur.pts.push(w); segment(cur); moved=true;
  }
  if(moved) renderView();
});
function endPtr(e){
  if(ptrs[e.pointerId]){ delete ptrs[e.pointerId]; ptrCount=Math.max(0,ptrCount-1); }
  if(e.pointerId===drawId){ commitTmp(); drawId=null; cur=null; renderView(); }
  if(ptrCount<2) gesture=null;
}
dcv.addEventListener('pointerup',endPtr);
dcv.addEventListener('pointercancel',endPtr);
window.addEventListener('pointerup',endPtr);

function zoomBy(f){
  var want=clamp(zoom*f, 1, 5);
  var k=want/zoom;
  panX = DW/2 - (DW/2 - panX)*k;
  panY = DH/2 - (DH/2 - panY)*k;
  zoom=want; clampPan(); renderView(); sfx.tap();
}
$('zoomIn').addEventListener('click',function(){ zoomBy(1.5); });
$('zoomOut').addEventListener('click',function(){ zoomBy(1/1.5); });
$('zoomReset').addEventListener('click',function(){ zoom=1; clampPan(); renderView(); sfx.tap(); });

/* ---------- 原画 → いきもの ---------- */
function extract(){
  if(!art) return null;
  var W=art.width, H=art.height, data;
  try{ data=actx.getImageData(0,0,W,H).data; }catch(err){ return null; }
  var minX=W, minY=H, maxX=-1, maxY=-1, x, y;
  for(y=0;y<H;y++){
    var row=y*W;
    for(x=0;x<W;x++){
      if(data[(row+x)*4+3]>20){
        if(x<minX)minX=x; if(x>maxX)maxX=x;
        if(y<minY)minY=y; if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0) return null;
  var pad=Math.round(5*ADPR);
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(W-1,maxX+pad); maxY=Math.min(H-1,maxY+pad);
  var cw=maxX-minX+1, ch=maxY-minY+1;
  var k=Math.min(1, 560/Math.max(cw,ch));
  var out=document.createElement('canvas');
  out.width=Math.max(1,Math.round(cw*k)); out.height=Math.max(1,Math.round(ch*k));
  var o=out.getContext('2d');
  o.imageSmoothingEnabled=true; o.imageSmoothingQuality='high';
  o.drawImage(art, minX,minY,cw,ch, 0,0,out.width,out.height);
  var cssW=cw/ADPR, cssH=ch/ADPR, m=Math.max(cssW,cssH);
  var target=clamp(m*0.55, 80, 190), sc=target/m;
  return {img:out, w:cssW*sc, h:cssH*sc};
}
/* まっさらな紙にする */
function newDrawing(){
  strokes=[]; cur=null; drawId=null; gesture=null; ptrs={}; ptrCount=0;
  art=null; tmp=null; tctx=null; useTmp=false; zoom=1;
  pendingFav=false; editingSp=null; baseLen=0;
}
/* すでにいる子を紙に読み込んで、なおせるようにする */
function loadForEdit(sp){
  ensureArt();
  pendingFav = !!sp.fav;
  editingSp = sp;
  var maxDim=Math.min(AW,AH)*0.62;
  var k=maxDim/Math.max(sp.w, sp.h);
  var dw=sp.w*k, dh=sp.h*k;
  actx.drawImage(sp.img, (AW-dw)/2, (AH-dh)/2, dw, dh);
  pushSnapshot();
  baseLen = strokes.length;
  renderView();
  $('hint').style.display='none';
}

function paintClouds(t,col){

function paintGround(top,edge){

function paintWorld(t){

    sctx.restore();
    sctx.fillStyle='rgba(235,250,255,.45)';
    for(var b=0;b<bubbles.length;b++){
      var bb=bubbles[b];
      bb.y-=bb.v*0.016; if(bb.y<-0.05){ bb.y=1.05; bb.x=Math.random(); }

    sctx.fillStyle='#E8D9A8'; sctx.fillRect(0,gy2,WW,GH());
  }else{
    g=sctx.createLinearGradient(0,0,0,WH);
    g.addColorStop(0,'#14122B'); g.addColorStop(1,'#2A1B44');

      sctx.beginPath(); sctx.arc(st.x*WW, st.y*WH, st.r,0,6.3); sctx.fill();
    }
    sctx.globalAlpha=1;

    sctx.beginPath(); sctx.arc(0,0,pr*1.7,0,6.3); sctx.stroke(); sctx.restore();
  }
}

var parts=[];
/* 1ぴきは どこか1か所にしかいない。
   起きている子は そのワールドにだけいて、
   おやすみ中の子は ぜんぶのワールドで共通のボックスに入る。
   だから 昼でねかせた子を ジャングルで起こせば、その子は引っこす。
   creatures は「いま見ているワールド」の配列への参照。useWorld 以外で代入しないこと。 */
var worldStore={};
function slot(id){
  if(!worldStore[id]) worldStore[id]={live:[]};
  return worldStore[id];
}
var sleeping=[];                                  // 共通のおやすみボックス
var creatures=slot(WORLDS[0].id).live;
function useWorld(){
  creatures=slot(W().id).live;
  parts.length=0; grabs={};
  updateCount(); updateSleep();
}
function srcOf(o){
  if(!o.src){ try{ o.src=o.img.toDataURL('image/png'); }catch(e){ o.src=null; } }
  return o.src;
}
function toCanvas(im){
  var c=document.createElement('canvas');
  c.width=im.naturalWidth||im.width||1; c.height=im.naturalHeight||im.height||1;
  c.getContext('2d').drawImage(im,0,0);
  return c;
}
function makeCreature(sp, opts){
  opts=opts||{};
  return {
    img:sp.img, src:sp.src||null, w:sp.w, h:sp.h, fav:!!sp.fav,
    x: opts.x!==undefined?opts.x: spawnPos().x,
    y: opts.y!==undefined?opts.y: spawnPos().y,
    vx:(Math.random()*2-1)*180, vy:0,
    rot:0, rotV:(Math.random()*2-1)*0.7, squash:0, wob:Math.random()*6,
    hopT:0.5+Math.random()*1.6, held:false
  };
}
function addCreature(sp, opts){
  var c=makeCreature(sp, opts);
  creatures.push(c);
  while(creatures.length>12){
    var old=creatures.shift();
    sleeping.push({img:old.img, src:old.src, w:old.w, h:old.h, fav:old.fav});
  }
  trimSleeping();
  updateCount(); updateSleep();
  return c;
}
function updateCount(){
  $('count').textContent = creatures.length + ' ひき';
  $('editBtn').hidden = (creatures.length + sleeping.length) === 0;
}

function burst(x,y,col){
  for(var i=0;i<16;i++){
    var a=Math.random()*6.3, s=90+Math.random()*260;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,life:1,col:col||'#FFD75E',r:2+Math.random()*3});
  }
}

function step(dt,t){
  var w=W();
  var groundY = w.wrap ? WH+400 : WH-GH();
  for(var i=0;i<creatures.length;i++){
    var c=creatures[i];
    c.squash *= Math.exp(-dt*7);
    if(c.held){
      if(w.spin) c.rot += c.rotV*dt*0.4;
      else c.rot += (clamp(c.vx*0.0004,-0.4,0.4)-c.rot)*Math.min(1,dt*8);
      continue;
    }
    c.wob += dt*2.1;
    c.vy += w.gravity*dt;
    if(w.floaty){
      c.vy -= 200*dt;
      c.vx += Math.sin(c.wob)*26*dt;
      c.vy += Math.cos(c.wob*0.83)*22*dt;
    }
    var d=Math.pow(w.drag, dt*60);
    c.vx*=d; c.vy*=d;
    c.x += c.vx*dt; c.y += c.vy*dt;

    var hw=c.w/2, hh=c.h/2;
    if(w.wrap){
      if(c.x < -hw) c.x = WW+hw; else if(c.x > WW+hw) c.x = -hw;
      if(c.y < -hh) c.y = WH+hh; else if(c.y > WH+hh) c.y = -hh;
      c.rot += c.rotV*dt;
    }else{
      if(c.x-hw<0){ c.x=hw; c.vx=Math.abs(c.vx)*0.78; }
      if(c.x+hw>WW){ c.x=WW-hw; c.vx=-Math.abs(c.vx)*0.78; }
      if(c.y-hh<0){ c.y=hh; c.vy=Math.abs(c.vy)*0.6; }
      if(c.y+hh>groundY){
        c.y=groundY-hh;
        if(c.vy>240){ c.squash=clamp(c.vy/2600,0.08,0.42); sfx.land(c.vy); }
        c.vy = -c.vy*(w.floaty?0.35:0.56);
        if(Math.abs(c.vy)<90) c.vy=0;
        c.vx *= 0.88;
        if(w.hop){
          c.hopT-=dt;
          if(c.hopT<=0 && Math.abs(c.vy)<1){
            c.vy = -(560+Math.random()*340);
            c.vx += (Math.random()*2-1)*200;
            c.squash=-0.2;
            c.hopT=1.1+Math.random()*2.4;
          }
        }
      }
      if(w.floaty) c.rot = Math.sin(c.wob)*0.2;
      else c.rot += (clamp(c.vx*0.0004,-0.4,0.4)-c.rot)*Math.min(1,dt*8);
    }
  }
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p];
    q.vy += 900*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt*1.5;
    if(q.life<=0) parts.splice(p,1);
  }
}

function paintCreatures(){
  var w=W();
  var groundY = WH-GH();
  for(var i=0;i<creatures.length;i++){
    var c=creatures[i];
    if(!w.wrap){
      var dist=clamp((groundY-(c.y+c.h/2))/260,0,1);
      sctx.save();
      sctx.globalAlpha=0.20*(1-dist);
      sctx.fillStyle='#1E2A18';
      sctx.beginPath();
      sctx.ellipse(c.x, groundY-4, c.w*0.36*(1-dist*0.3), 7*(1-dist*0.4), 0,0,6.3);
      sctx.fill(); sctx.restore();
    }
    var sq=c.squash;
    var sx=1+sq*0.55, sy=1-sq*0.45;
    sctx.save();
    sctx.translate(c.x,c.y); sctx.rotate(c.rot); sctx.scale(sx,sy);
    if(c.held){ sctx.shadowColor='rgba(0,0,0,.3)'; sctx.shadowBlur=18; sctx.shadowOffsetY=8; }
    sctx.drawImage(c.img, -c.w/2, -c.h/2, c.w, c.h);
    sctx.restore();
  }
  for(var p=0;p<parts.length;p++){
    var q=parts[p];
    sctx.globalAlpha=clamp(q.life,0,1);
    sctx.fillStyle=q.col;
    sctx.beginPath(); sctx.arc(q.x,q.y,q.r,0,6.3); sctx.fill();
  }
  sctx.globalAlpha=1;
}

/* ====================== カメラ（ひろいワールド） ======================
   ワールドは画面の2倍の広さ。画面はそこを覗くカメラで、
   画面座標 = ワールド座標 * camS + cam。 */
var WORLD_K=2, WW=0, WH=0, SDPR=1;
var camS=0, camX=0, camY=0;
function GH(){ return W().groundH*WORLD_K; }
function fitS(){ return WW ? Math.min(SW/WW, SH/WH) : 1; }
function clampCam(){
  var w=WW*camS, h=WH*camS;
  camX = (w<=SW) ? (SW-w)/2 : clamp(camX, SW-w, 0);
  camY = (h<=SH) ? (SH-h)/2 : clamp(camY, SH-h, 0);
}
function setWorld(){
  WW=SW*WORLD_K; WH=SH*WORLD_K;
  var f=fitS();
  if(!camS){ camS=1; camX=(SW-WW)/2; camY=(SH-WH)/2; }
  camS=clamp(camS, f, 1.8);
  clampCam(); updateCamLabel();
}
function toWorld(sx,sy){ return { x:(sx-camX)/camS, y:(sy-camY)/camS }; }
function viewCenter(){ return toWorld(SW/2, SH/2); }
function camZoom(f, ax, ay){
  var want=clamp(camS*f, fitS(), 1.8), k=want/camS;
  if(ax===undefined){ ax=SW/2; ay=SH/2; }
  camX = ax - (ax - camX)*k;
  camY = ay - (ay - camY)*k;
  camS = want; clampCam(); updateCamLabel();
}
function updateCamLabel(){
  var el=$('wZoomLabel'); if(!el) return;
  var pct=Math.round(camS*100);
  el.hidden = (pct>=99 && pct<=101);
  el.textContent = pct+'%';
}
function spawnPos(){
  var v=viewCenter();
  return { x: v.x + (Math.random()*2-1)*(SW*0.2/camS), y: v.y - (SH*0.22/camS) };
}

  try{
    var el=document.documentElement;
    if(on && el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen();
    else if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  }catch(e){}
  requestAnimationFrame(layout);
}

var last=performance.now();
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!stageScreen.hidden && SW>0){

    sctx.setTransform(SDPR*camS,0,0,SDPR*camS, SDPR*camX, SDPR*camY);
    paintWorld(t);

/* ====================== つかむ・なげる ====================== */
/* いきものの上なら つかむ（2匹同時もOK）。
   なにもない所なら 1本指でカメラを動かし、2本指でズームする。 */
var grabs={}, camPtrs={}, camN=0, camGes=null;
function pick(x,y){
  for(var i=creatures.length-1;i>=0;i--){
    var c=creatures[i], m=14/camS;
    if(x>c.x-c.w/2-m && x<c.x+c.w/2+m && y>c.y-c.h/2-m && y<c.y+c.h/2+m) return {c:c,i:i};
  }
  return null;
}
function camPtrList(){ var a=[]; for(var k in camPtrs) a.push(camPtrs[k]); return a; }
scv.addEventListener('pointerdown',function(e){
  ac();
  try{ scv.setPointerCapture(e.pointerId); }catch(err){}
  var p=pos(scv,e), wp=toWorld(p.x,p.y), hit=pick(wp.x,wp.y);
  if(hit){
    var c=hit.c;
    creatures.splice(hit.i,1); creatures.push(c);
    c.held=true; c.gdx=c.x-wp.x; c.gdy=c.y-wp.y;
    c.lx=wp.x; c.ly=wp.y; c.lt=performance.now();
    c.moved=0; c.t0=c.lt; c.vx=0; c.vy=0; c.squash=0.24;
    grabs[e.pointerId]=c;
    sfx.grab();
    return;
  }
  camPtrs[e.pointerId]={ x:p.x, y:p.y, moved:0, t:performance.now() };
  camN++;
  if(camN===2){
    var L=camPtrList();
    camGes={ mid:{x:(L[0].x+L[1].x)/2, y:(L[0].y+L[1].y)/2},
             dist:Math.max(1, Math.hypot(L[0].x-L[1].x, L[0].y-L[1].y)) };
  }
});
scv.addEventListener('pointermove',function(e){
  var c=grabs[e.pointerId];
  if(c){
    var q=pos(scv,e), wq=toWorld(q.x,q.y), now=performance.now();
    var dt=Math.max(10, now-c.lt)/1000;
    c.vx=clamp((wq.x-c.lx)/dt,-2600,2600);
    c.vy=clamp((wq.y-c.ly)/dt,-2600,2600);
    c.moved += (Math.abs(wq.x-c.lx)+Math.abs(wq.y-c.ly))*camS;
    c.x=wq.x+c.gdx; c.y=wq.y+c.gdy;
    c.lx=wq.x; c.ly=wq.y; c.lt=now;
    return;
  }
  var cp=camPtrs[e.pointerId]; if(!cp) return;
  var p=pos(scv,e);
  var dx=p.x-cp.x, dy=p.y-cp.y;
  cp.moved += Math.abs(dx)+Math.abs(dy);
  cp.x=p.x; cp.y=p.y;
  if(camN>=2 && camGes){
    var L=camPtrList();
    if(L.length<2) return;
    var mid={x:(L[0].x+L[1].x)/2, y:(L[0].y+L[1].y)/2};
    var dist=Math.max(1, Math.hypot(L[0].x-L[1].x, L[0].y-L[1].y));
    var want=clamp(camS*(dist/camGes.dist), fitS(), 1.8);
    var k=want/camS;
    camX = mid.x - (camGes.mid.x - camX)*k;
    camY = mid.y - (camGes.mid.y - camY)*k;
    camS = want;
    camGes.mid=mid; camGes.dist=dist;
    clampCam(); updateCamLabel();
  }else{
    camX+=dx; camY+=dy; clampCam();
  }
});
function release(e){
  var cp=camPtrs[e.pointerId];
  if(cp){
    delete camPtrs[e.pointerId];
    camN=Math.max(0,camN-1);
    if(camN<2) camGes=null;
    if(camN===0 && cp.moved<12 && (performance.now()-cp.t)<420){
      var w=toWorld(cp.x,cp.y);
      burst(w.x,w.y,'#FFE9A8'); sfx.tap();
    }
    return;
  }
  var c=grabs[e.pointerId]; if(!c) return;
  delete grabs[e.pointerId];
  c.held=false;
  var quick = c.moved<14 && (performance.now()-c.t0)<420;
  if(quick){
    c.vx=(Math.random()*2-1)*160;
    c.vy=-820; c.squash=-0.26;
    burst(c.x, c.y+c.h/2, '#FFD75E');
    sfx.jump();
  }else{
    sfx.toss();
  }
}

scv.addEventListener('pointercancel',release);

/* ====================== ほぞん ====================== */
var KEY='oekaki-world-v1';
function storageOK(){
  try{ localStorage.setItem('__ok','1'); localStorage.removeItem('__ok'); return true; }
  catch(e){ return false; }
}
function save(){
  try{
    var pack=function(o){ var d=srcOf(o); return d?{d:d, w:Math.round(o.w), h:Math.round(o.h), f:o.fav?1:0}:null; };
    var out={}, zzz=[], k, d, L, i, it;
    for(k in worldStore){
      d=worldStore[k]; L=[];
      for(i=0;i<d.live.length;i++){ it=pack(d.live[i]); if(it) L.push(it); }
      if(L.length) out[k]={list:L};
    }
    for(i=0;i<sleeping.length;i++){ it=pack(sleeping[i]); if(it) zzz.push(it); }
    localStorage.setItem(KEY, JSON.stringify({seeded:true, v:3, world:W().id, worlds:out, sleep:zzz}));
  }catch(e){}
}
function idIndex(id){
  for(var i=0;i<WORLDS.length;i++) if(WORLDS[i].id===id) return i;
  return 0;
}
function load(cb){
  var raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw){ cb(false); return; }
  var data=null;
  try{ data=JSON.parse(raw); }catch(e){}
  if(!data){ cb(false); return; }

  var jobs=[], k, d;
  if(data.worlds){
    for(k in data.worlds){
      if(!slotExists(k)) continue;
      d=data.worlds[k];
      (d.list||[]).forEach(function(it){ jobs.push({it:it, id:k, asleep:false}); });
      /* v2 は おやすみもワールド別だった。共通ボックスにまとめる */
      (d.sleep||[]).forEach(function(it){ jobs.push({it:it, id:k, asleep:true}); });
    }
    (data.sleep||[]).forEach(function(it){ jobs.push({it:it, id:null, asleep:true}); });
    wi = (typeof data.world==='string') ? idIndex(data.world) : 0;
  }else if(data.list){
    /* 旧形式（ワールド共通のひとつの群れ）からの移行。
       当時えらんでいたワールドに、まとめて引っ越す。 */
    var OLD=['hiru','umi','uchu'];
    var home = OLD[(typeof data.world==='number') ? data.world : 0] || 'hiru';
    (data.list||[]).forEach(function(it){ jobs.push({it:it, id:home, asleep:false}); });
    (data.sleep||[]).forEach(function(it){ jobs.push({it:it, id:home, asleep:true}); });
    wi = idIndex(home);
  }else{
    cb(false); return;
  }
  $('worldBtn').textContent=W().label;
  useWorld();

  var n=jobs.length, done=0;
  function fin(){ if(++done===n){ useWorld(); cb(true); } }
  if(!n){ useWorld(); cb(true); return; }
  jobs.forEach(function(job){
    var im=new Image();
    im.onload=function(){
      var sp={img:toCanvas(im), src:job.it.d, w:job.it.w, h:job.it.h, fav:!!job.it.f};
      if(job.asleep) sleeping.push(sp);
      else slot(job.id).live.push(makeCreature(sp));
      fin();
    };
    im.onerror=fin;
    im.src=job.it.d;
  });
}
function slotExists(id){
  for(var i=0;i<WORLDS.length;i++) if(WORLDS[i].id===id) return true;
  return false;
}

/* ====================== みほんの いきもの ====================== */
function doodle(col, kind){
  var S=320, c=document.createElement('canvas');
  c.width=S; c.height=S;
  var g=c.getContext('2d');
  g.lineCap='round'; g.lineJoin='round';
  g.lineWidth=17; g.strokeStyle=col;
  g.beginPath();
  for(var i=0;i<=72;i++){
    var a=i/72*Math.PI*2;
    var r=(kind===0?96:84)+Math.sin(a*3+kind*2)*11+Math.cos(a*5+kind)*7;
    var x=160+Math.cos(a)*r, y=150+Math.sin(a)*r*(kind===0?1:1.12);
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  }
  g.closePath();
  g.globalAlpha=0.28; g.fillStyle=col; g.fill(); g.globalAlpha=1;
  g.stroke();
  // あし
  g.lineWidth=14;
  g.beginPath(); g.moveTo(118,246); g.lineTo(104,286); g.moveTo(198,246); g.lineTo(212,286); g.stroke();
  if(kind===1){ g.beginPath(); g.moveTo(130,64); g.lineTo(112,24); g.moveTo(190,64); g.lineTo(208,24); g.stroke(); }
  // め
  g.fillStyle='#2B2B33';
  g.beginPath(); g.arc(128,136,15,0,6.3); g.arc(196,136,15,0,6.3); g.fill();
  g.fillStyle='#fff';
  g.beginPath(); g.arc(133,131,5,0,6.3); g.arc(201,131,5,0,6.3); g.fill();
  // くち
  g.strokeStyle='#2B2B33'; g.lineWidth=8;
  g.beginPath(); g.arc(162,172,26,0.25,Math.PI-0.25); g.stroke();
  return {img:c, w:kind===0?126:112, h:kind===0?126:120};
}
